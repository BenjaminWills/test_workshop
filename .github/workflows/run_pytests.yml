name: Run pytest

on: 
  pull_request:
    branches:
      - main

jobs:
  run-tests: 
    steps:
      - uses: actions/checkout@v3
      - name: Install Python
        uses: actions/setup-python@v4.6.0
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest